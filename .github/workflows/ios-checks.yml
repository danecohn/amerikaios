name: iPhone build checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: false
jobs:
  ios-simulator:
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      CI: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v6
        with:
          version: '11.25.0'
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm check:jsx
      - run: pnpm test
      - run: pnpm exec expo install --check
      - name: Generate iOS project and install pods
        run: pnpm exec expo prebuild --platform ios
      - name: Warm the simulator while Xcode compiles
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | node -e 'let s="";process.stdin.on("data",c=>s+=c);process.stdin.on("end",()=>{const rows=Object.entries(JSON.parse(s).devices).filter(([key,ds])=>key.includes("iOS")&&ds.some(d=>d.isAvailable&&d.name.startsWith("iPhone"))).sort(([a],[b])=>b.localeCompare(a,"en",{numeric:true}));const d=rows[0]?.[1].find(d=>d.isAvailable&&d.name.startsWith("iPhone"));if(!d)process.exit(1);process.stdout.write(d.udid);});')
          echo "VIGIL_SIMULATOR_UDID=$DEVICE_ID" >> "$GITHUB_ENV"
          xcrun simctl boot "$DEVICE_ID"
          xcrun simctl bootstatus "$DEVICE_ID" -b > simulator-boot.log 2>&1 &
      - name: Compile iPhone simulator app
        run: |
          set -o pipefail
          xcodebuild -workspace ios/VigilSocial.xcworkspace -scheme VigilSocial -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build CODE_SIGNING_ALLOWED=YES CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=- build > xcode-build.log 2>&1 || { tail -n 100 xcode-build.log; exit 1; }
          ditto -c -k --keepParent build/Build/Products/Release-iphonesimulator/VigilSocial.app AmerikaSocial-simulator.zip
      - name: Launch native app and capture iPhone preview
        timeout-minutes: 15
        run: |
          DEVICE_ID="$VIGIL_SIMULATOR_UDID"
          xcrun simctl bootstatus "$DEVICE_ID" -b
          xcrun simctl install "$DEVICE_ID" build/Build/Products/Release-iphonesimulator/VigilSocial.app
          xcrun simctl launch --terminate-running-process "$DEVICE_ID" social.amerika.ios
          sleep 15
          xcrun simctl spawn "$DEVICE_ID" launchctl list | awk '$3 ~ /social.amerika.ios/ && $1 ~ /^[0-9]+$/ {alive=1} END {exit !alive}'
          xcrun simctl io "$DEVICE_ID" screenshot AmerikaSocial-iPhone-preview.png
          swift scripts/check-simulator-screen.swift AmerikaSocial-iPhone-preview.png
      - name: Upload simulator build
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Amerika-Social-iPhone-simulator
          path: |
            AmerikaSocial-simulator.zip
            AmerikaSocial-iPhone-preview.png
          retention-days: 7
      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ios-build-diagnostics
          path: |
            xcode-build.log
            simulator-boot.log
          retention-days: 7
